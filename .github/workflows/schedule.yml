name: Pinterest Auto Marketer Scheduled Cycle

on:
  schedule:
    # Runs 3 times a day at peak Pinterest engagement hours (UTC 14:00, 17:00, 21:00)
    - cron: '0 14,17,21 * * *'
  workflow_dispatch:
    inputs:
      dry_run_override:
        description: 'Force Dry Run (Simulate only)'
        required: true
        type: boolean
        default: true
      pin_count:
        description: 'Number of pins to process in this run'
        required: false
        default: '2'

permissions:
  contents: write

jobs:
  run-marketing-loop:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Autonomous Marketer Cycle
        env:
          # Required Secrets for live publishing (must be configured in GitHub Repo Secrets)
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
          
          # Safety Flags (Defaults to SAFE / DRY_RUN if secrets are unset)
          ENABLE_PUBLISH: ${{ secrets.ENABLE_PUBLISH || 'false' }}
          DRY_RUN_MODE: ${{ github.event.inputs.dry_run_override != '' && github.event.inputs.dry_run_override || secrets.DRY_RUN_MODE || 'true' }}
          MAX_PINS_PER_DAY: ${{ secrets.MAX_PINS_PER_DAY || '10' }}
          CRON_RUNS_PER_DAY: '3'
          
          # Optional Free Integrations
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          HUGGINGFACE_TOKEN: ${{ secrets.HUGGINGFACE_TOKEN }}
          USE_LLM_COPY: ${{ secrets.USE_LLM_COPY || 'false' }}
        run: |
          echo "🛡️ Starting Pinterest Auto Marketer cycle..."
          echo "Safety Gate ENABLE_PUBLISH: $ENABLE_PUBLISH"
          echo "DRY_RUN_MODE: $DRY_RUN_MODE"
          echo "MAX_PINS_PER_DAY: $MAX_PINS_PER_DAY"
          
          # Run the schedule runner
          python orchestrator/schedule_runner.py

      - name: Commit and Push Persistent Logs & Hashes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/daily_published.json logs/hash_registry.json logs/adjustments.json logs/publish_audit.log || true
          git diff --staged --quiet || git commit -m "chore(logs): update daily counters and audit logs [skip ci]" || true
          git push || true

      - name: Upload Run Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinterest-marketer-artifacts-${{ github.run_id }}
          path: |
            logs/
            examples/
          retention-days: 14
